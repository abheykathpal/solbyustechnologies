<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">SolByUs Technologies logo</title>
  <desc id="desc">A blue SolByUs Technologies logo on a dark background.</desc>
  <defs>
    <linearGradient id="sGradient" x1="120" y1="120" x2="480" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16f1ff"/>
      <stop offset="0.46" stop-color="#0086ff"/>
      <stop offset="1" stop-color="#082cc8"/>
    </linearGradient>
    <linearGradient id="pixelGradient" x1="360" y1="90" x2="500" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18f2ff"/>
      <stop offset="1" stop-color="#0a48e8"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">

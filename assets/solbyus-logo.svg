      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.65 0 0 0 0 1 0 0 0 0.8 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" rx="42" fill="#020818"/>
  <g filter="url(#glow)">
